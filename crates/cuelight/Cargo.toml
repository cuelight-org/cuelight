[package]
name = "cuelight"
description = "Embeddable multimedia engine: declarative shows of layers and timelines driven by triggers and variables"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["multimedia", "scene-graph", "animation", "compositor", "embeddable"]
categories = ["multimedia", "rendering", "graphics"]

[dependencies]
cuelight-core = { path = "../cuelight-core", version = "0.0.1" }
thiserror = "2"

vello = { version = "0.10", optional = true }
pollster = { version = "1.0", optional = true }
png = { version = "0.18", optional = true }
skrifa = { version = "0.44", optional = true }

[dev-dependencies]
serde_json = "1"
# examples only: windowed demos
winit = "0.30"
ctrlc = "3"
cpal = "0.18"
log = "0.4"
env_logger = "0.11"

[features]
default = ["render"]
render = ["dep:vello", "dep:pollster", "dep:png"]
# Outline (TrueType/OpenType) fonts for text layers: measuring and glyph
# placement in the engine. Off by default so a bitmap-font-only embed stays
# lean; the renderer draws the resulting glyph runs either way.
outline-fonts = ["dep:skrifa"]

[[example]]
name = "render_to_images"
required-features = ["render"]

[[example]]
name = "render_to_window"
required-features = ["render"]

[[example]]
name = "slideshow"
required-features = ["render"]

[[example]]
name = "mic_pop"
required-features = ["render"]
