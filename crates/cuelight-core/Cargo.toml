[package]
name = "cuelight-core"
description = "The deterministic model behind a cuelight show: its document, its state, and the clock that moves it, with nothing drawn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["multimedia", "animation", "timeline", "deterministic"]
categories = ["multimedia"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = { version = "1", optional = true }

[features]
# JSON Schema generation for the show format (see cuelight/schemas/)
schema = ["dep:schemars"]

[lints]
workspace = true
